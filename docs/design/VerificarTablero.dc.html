<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Verificar tablero</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1172B3}a:hover{color:#0B5687}
.p{width:380px;height:860px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;background:#F2F4F7;color:#1D2330;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:1.4;overflow:hidden}
.hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#FFFFFF;border-bottom:1px solid #DCE1E8}
.brand{display:flex;align-items:center;gap:8px;font-family:'Sora',sans-serif;font-weight:600;font-size:15px}
.brand b{color:#1172B3;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.warn{background:#FDF1DC;color:#8A5A0B}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.hs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 16px}
.hi{display:flex;flex-direction:column;gap:2px;padding:8px 10px;background:#FFFFFF;border:1px solid #DCE1E8;border-radius:8px;font-size:12px}
.hi span{display:flex;align-items:center;gap:6px;font-weight:600}
.hi small{color:#5B6474;font-size:11px}
.sec{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.lbl{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5B6474;font-weight:600}
.cam{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border-radius:6px;overflow:hidden;border:1px solid #C3CBD6}
.mono{font-family:'IBM Plex Mono',monospace}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid #C3CBD6;background:#FFFFFF;color:#1D2330;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:#1172B3;border-color:#1172B3;color:#FFFFFF}
</style>
</helmet>
<div class="p">
<header class="hd">
<div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5" stroke="#1E96D7" stroke-width="2"></path><circle cx="12" cy="12" r="4.5" fill="#1D2330"></circle></svg><span>Chess<b>Optic</b></span></div>
<span class="pill warn"><span class="dot"></span>Tablero incompleto</span>
</header>
<div class="hs">
<div class="hi"><span><span class="dot" style="color:#1F8A4C"></span>Cámara</span><small>30 fps</small></div>
<div class="hi" style="border-color:#E2B866"><span><span class="dot" style="color:#B7791F"></span>Tablero</span><small>Faltan 2</small></div>
<div class="hi"><span><span class="dot" style="color:#8A93A3"></span>Enlace</span><small>Inactivo</small></div>
</div>
<div class="sec">
<div style="font-family:'Sora',sans-serif;font-size:20px;font-weight:700">Armá la posición inicial</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
<div style="background:#FFFFFF;border:1px solid #DCE1E8;border-radius:8px;padding:8px 10px"><div style="font-size:11px;color:#5B6474">Blancas</div><div class="mono" style="font-size:20px;font-weight:600">15 / 16</div></div>
<div style="background:#FFFFFF;border:1px solid #DCE1E8;border-radius:8px;padding:8px 10px"><div style="font-size:11px;color:#5B6474">Negras</div><div class="mono" style="font-size:20px;font-weight:600">15 / 16</div></div>
</div>
<div style="background:#FDF1DC;border:1px solid #E2B866;border-radius:8px;padding:10px 12px">Falta una pieza en <b class="mono">d1</b> y otra en <b class="mono">g8</b>.</div>
</div>
<div class="sec">
<div class="lbl"><span>Cámara · vista rectificada</span><span>a1 abajo izq.</span></div>
<div class="cam">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="64"><div style="{{c.sq}}"><div style="{{c.pc}}"></div></div></sc-for>
</div>
</div>
<div class="sec" style="margin-top:auto;padding-bottom:16px">
<div style="color:#5B6474;font-size:12px">Cuando las 32 piezas estén en su lugar, ChessOptic sigue solo.</div>
<div style="display:flex;gap:8px"><button class="btn">Recalibrar</button><button class="btn" style="flex:1">Empezar desde otra posición</button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":380,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = ['bbbbbb.b','bbbbbbbb','........','........','........','........','wwwwwwww','www.wwww'];
    const hi = { d1: '#F3D3A1', g8: '#F3D3A1' };
    const files = 'abcdefgh';
    const cells = [];
    rows.forEach((row, r) => {
      for (let f = 0; f < 8; f++) {
        const ch = row[f];
        const n = files[f] + (8 - r);
        const dark = (r + f) % 2 === 1;
        cells.push({
          sq: { display: 'flex', alignItems: 'center', justifyContent: 'center', aspectRatio: '1 / 1', background: hi[n] || (dark ? '#C7D1DD' : '#EAEEF3') },
          pc: ch === '.' ? { display: 'none' } : { width: '58%', height: '58%', borderRadius: '50%', boxSizing: 'border-box', background: ch === 'w' ? '#FFFFFF' : '#1D2330', border: ch === 'w' ? '2px solid #5B6474' : '2px solid #1D2330' }
        });
      }
    });
    return { cells };
  }
}
</script>
</body>
</html>
