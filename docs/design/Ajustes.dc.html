<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ajustes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;600&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1172B3}a:hover{color:#0B5687}
.p{width:380px;height:860px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;background:#F2F4F7;color:#1D2330;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;line-height:1.4;overflow:hidden}
.hd{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#FFFFFF;border-bottom:1px solid #DCE1E8}
.brand{display:flex;align-items:center;gap:8px;font-family:'Sora',sans-serif;font-weight:600;font-size:15px}
.brand b{color:#1172B3;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.ok{background:#E3F4EA;color:#17663A}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.sec{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5B6474;font-weight:600}
.group{display:flex;flex-direction:column;background:#FFFFFF;border:1px solid #DCE1E8;border-radius:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:4px 12px;border-top:1px solid #EDF0F4}
.row:first-child{border-top:0}
.row label{font-weight:600}
.row select{min-height:32px;border:1px solid #C3CBD6;border-radius:6px;padding:0 8px;font:inherit;background:#FFFFFF;color:#1D2330;max-width:170px}
.row input[type=range]{width:140px;accent-color:#1172B3}
.row input[type=checkbox]{width:18px;height:18px;accent-color:#1172B3}
.mono{font-family:'IBM Plex Mono',monospace}
.diag{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.diag div{background:#FFFFFF;border:1px solid #DCE1E8;border-radius:8px;padding:8px 10px}
.diag small{display:block;font-size:11px;color:#5B6474}
.nav{margin-top:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#FFFFFF;border-top:1px solid #DCE1E8}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;font-size:11px;color:#5B6474;text-decoration:none}
.nav a.on{color:#1172B3;font-weight:600}
</style>
</helmet>
<div class="p">
<header class="hd">
<div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5" stroke="#1E96D7" stroke-width="2"></path><circle cx="12" cy="12" r="4.5" fill="#1D2330"></circle></svg><span>Chess<b>Optic</b></span></div>
<span class="pill ok"><span class="dot"></span>Driver OK</span>
</header>
<div class="sec">
<div style="font-family:'Sora',sans-serif;font-size:20px;font-weight:700">Ajustes</div>
<div class="lbl">Salida</div>
<div class="group">
<div class="row"><label for="s-out">Plataforma</label><select id="s-out"><option>Chessconnect · BLE</option><option>Chessconnect · serie</option><option>Lichess</option><option>Stockfish local</option></select></div>
<div class="row"><label for="s-promo">Promoción</label><select id="s-promo"><option>Preguntar en la plataforma</option><option>Siempre dama</option></select></div>
</div>
</div>
<div class="sec">
<div class="lbl">Detección</div>
<div class="group">
<div class="row"><label for="s-stab">Estabilidad</label><input type="range" id="s-stab" min="200" max="1500" value="750"></div>
<div class="row" style="justify-content:flex-start;color:#5B6474;font-size:12px;min-height:0;padding-bottom:10px;border-top:0">Espera 750 ms sin movimiento antes de aceptar una jugada.</div>
<div class="row"><label for="s-frames">Guardar frames de errores</label><input type="checkbox" id="s-frames" checked></div>
</div>
</div>
<div class="sec">
<div class="lbl">Ventana</div>
<div class="group">
<div class="row"><label for="s-top">Siempre arriba</label><input type="checkbox" id="s-top" checked></div>
<div class="row"><label for="s-compact">Modo compacto en partida</label><input type="checkbox" id="s-compact"></div>
<div class="row"><label for="s-sound">Sonido en errores</label><input type="checkbox" id="s-sound" checked></div>
<div class="row"><label for="s-lang">Idioma</label><select id="s-lang"><option>Español</option><option>English</option></select></div>
</div>
</div>
<div class="sec">
<div class="lbl">Diagnóstico</div>
<div class="diag">
<div><small>Análisis</small><b class="mono">14 fps</b></div>
<div><small>Latencia</small><b class="mono">82 ms</b></div>
<div><small>Protocolo</small><b class="mono">1,2 kB/s</b></div>
</div>
<a href="#" style="font-weight:600">Ver tráfico del protocolo</a>
</div>
<nav class="nav">
<a href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>En vivo</a>
<a href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"></rect><circle cx="12" cy="13" r="4"></circle></svg>Cámara</a>
<a href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"></path></svg>Log</a>
<a class="on" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"></path></svg>Ajustes</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":380,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
