[project]
name = "chessoptic"
version = "0.1.0"
description = "Driver for a webcam-based electronic chess board"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Sandy Veliz" }]
keywords = ["chess", "computer-vision", "opencv", "electronic-board"]
dependencies = [
  "numpy>=2.0",
  # opencv-python-headless, NOT opencv-python: the regular wheel bundles its own Qt
  # and breaks PySide6 on Linux.
  "opencv-python-headless>=4.10",
  "chess>=1.11",
  "PySide6>=6.8",
  "platformdirs>=4.0",
]

[project.scripts]
chessoptic = "chessoptic.cli:main"

[project.urls]
Homepage = "https://github.com/sandyeveliz/chessoptic"

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chessoptic"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "W"]
ignore = ["RUF012"]
allowed-confusables = ["–", "×"]

[tool.ruff.lint.isort]
known-first-party = ["chessoptic"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true
